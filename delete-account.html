<h1>계정과 기록 삭제</h1>
<p>현재 「순행록(가칭)」에는 계정 기능이 없고, 게임 기록은 이용자의 기기 안에만 저장됩니다.</p>
<ul>
<li><b>기록을 지우려면</b>: 휴대폰의 설정 → 앱 → 순행록 → 저장공간 → 데이터 삭제, 또는 앱을 삭제하십시오.</li>
<li>운영자의 서버에는 이용자의 기록이 없으므로 따로 삭제를 요청할 것이 없습니다.</li>
</ul>
<p>계정 로그인 기능을 넣으면 이 페이지에서 계정 삭제를 요청할 수 있게 합니다. 문의: skaru3000@gmail.com</p>
